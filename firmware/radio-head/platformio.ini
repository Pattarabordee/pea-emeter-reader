; Radio head firmware (design doc 2026-11-19 section 5). Build: pio run -e xiao_c6 ; flash: pio run -e xiao_c6 -t upload
[env]
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.5.2
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the board's own USB port

; ESP32-C6 needs Arduino core 3.x, which only the pioarduino fork of the platform ships.
[env:xiao_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6

; Same code on a C3 with the stock platform (no external-antenna switch).
[env:xiao_c3]
platform = espressif32
board = seeed_xiao_esp32c3
